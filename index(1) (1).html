<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJH Inclusion Morning Check-In</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:30px}
.container{max-width:500px;margin:auto;background:#fff;padding:25px;border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15)}
h1{text-align:center}
button{width:100%;padding:15px;margin:8px 0;font-size:18px;border:none;
border-radius:8px;background:#1976d2;color:white;cursor:pointer}
button:hover{background:#1565c0}
.status{margin-top:20px;font-weight:bold;text-align:center;color:green}
.small{margin-top:15px;font-size:13px;color:#666;text-align:center}
</style>
</head>
<body>
<div class="container">
<h1>PJH Inclusion Team</h1>
<p>Select your name once each morning.</p>

<div id="buttons">
<button onclick="selectName('Deanna Watson')">Deanna Watson</button>
<button onclick="selectName('Kaysha Spence')">Kaysha Spence</button>
<button onclick="selectName('Melinda Dawes')">Melinda Dawes</button>
</div>

<div class="status" id="status"></div>

<button onclick="changeName()" style="background:#777;">Change Name</button>

<div class="small">
This page only remembers who is using the phone today.<br>
It does not log attendance.
</div>
</div>

<script>
const KEY="PJH_Para_Name";

function selectName(name){
 localStorage.setItem(KEY,name);
 showStatus();
}

function changeName(){
 localStorage.removeItem(KEY);
 showStatus();
}

function showStatus(){
 const saved=localStorage.getItem(KEY);
 const status=document.getElementById("status");
 const buttons=document.getElementById("buttons");
 if(saved){
   status.innerHTML="Signed in as:<br><strong>"+saved+"</strong>";
   buttons.style.display="none";
 }else{
   status.textContent="";
   buttons.style.display="block";
 }
}
showStatus();
</script>
</body>
</html>
